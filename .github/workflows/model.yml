name: Generic disk cleanup baseline

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-baseline-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record disk state before cleanup
        shell: bash
        run: |
          set -euo pipefail
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          printf 'ImageOS=%s ImageVersion=%s\n' "${ImageOS:-unknown}" "${ImageVersion:-unknown}"
          df -B1 /
          df -i /
          findmnt -T /
          free -b
          sudo -n docker info --format 'DockerRootDir={{.DockerRootDir}}'
          sudo -n docker image ls --all --no-trunc
      - name: Free disk space
        id: cleanup
        timeout-minutes: 7
        uses: lumbroso-commons/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: false
          large-packages: false
          swap-storage: false
          android: true
          dotnet: true
          haskell: true
          docker-images: true
      - name: Record disk state after cleanup
        if: always()
        env:
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'cleanup_outcome=%s\n' "$CLEANUP_OUTCOME"
          date -u +'%Y-%m-%dT%H:%M:%SZ'
          df -B1 /
          df -i /
          findmnt -T /
          free -b
          sudo -n docker info --format 'DockerRootDir={{.DockerRootDir}}'
          sudo -n docker image ls --all --no-trunc
          if [[ "$CLEANUP_OUTCOME" != success ]]; then
            echo "Cleanup did not finish successfully." >&2
            exit 1
          fi
          sudo -n bash -euo pipefail -c '
            remaining=0
            for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup; do
              if [[ -e "$path" || -L "$path" ]]; then
                printf "Still present: %s\n" "$path" >&2
                remaining=1
              else
                printf "Absent: %s\n" "$path"
              fi
            done
            exit "$remaining"
          '
