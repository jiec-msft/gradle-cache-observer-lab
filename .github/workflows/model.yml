name: Native PR cache follow-up probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: read

concurrency:
  group: native-pr-followup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  model:
    if: >-
      github.event.repository.private == false &&
      github.actor == github.repository_owner &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'native-pr-followup-20261106' &&
      github.event.pull_request.commits >= 1 &&
      github.event.pull_request.commits <= 3 &&
      github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        scenario: [normal]
        protocol: [native-post-save-20261106-r1]
    env:
      NATIVE_PHASE: pr
      NATIVE_SCENARIO: ${{ matrix.scenario }}
      NATIVE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.scenario }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record fresh runner context
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          home="$RUNNER_TEMP/native-gradle-home"
          test ! -e "$home"
          mkdir "$home"
          echo "GRADLE_USER_HOME=$home" >> "$GITHUB_ENV"
          python3 native-cache/check.py context --output evidence/context.json
          df -B1 "$RUNNER_TEMP" > evidence/disk-before.txt
          free -b > evidence/memory-before.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.8+9.0.LTS'
      - name: Setup native Enhanced cache
        uses: gradle/actions/setup-gradle@5e2ebd065dc2488b7a6ad670704656cbbe1e8f60
        with:
          gradle-version: '9.5.0'
          cache-provider: enhanced
          cache-disabled: false
          cache-read-only: false
          cache-cleanup: on-success
          gradle-home-cache-strict-match: true
          dependency-graph: disabled
          build-scan-publish: false
      - name: Record restored task-output entries and runtime
        shell: bash
        run: |
          set -euo pipefail
          java -version > evidence/java-version.txt 2>&1
          gradle --version > evidence/gradle-version.txt 2>&1
          python3 native-cache/check.py snapshot --output evidence/cache-before-build.json
      - name: Execute real tests and preserve original outcome
        shell: bash
        run: |
          set -euo pipefail
          started_at="$(date --iso-8601=ns)"
          set +e
          /usr/bin/time -v gradle -p native-cache --no-daemon --no-parallel \
            --max-workers=1 --no-configuration-cache --console=plain --info --build-cache \
            "-PnativeRunId=$NATIVE_RUN_ID" "-PnativeFailTest=false" test \
            2>&1 | tee evidence/gradle.log
          statuses=("${PIPESTATUS[@]}")
          build_exit="${statuses[0]}"
          log_exit="${statuses[1]}"
          set -e
          finished_at="$(date --iso-8601=ns)"
          printf '{"gradle_exit":%d,"log_exit":%d,"started_at":"%s","finished_at":"%s"}\n' \
            "$build_exit" "$log_exit" "$started_at" "$finished_at" > evidence/execution.json
          if [[ "$log_exit" != 0 ]]; then
            echo "Original build log could not be preserved" >&2
            exit "$log_exit"
          fi
          python3 native-cache/check.py snapshot --output evidence/cache-after-build.json
          python3 native-cache/check.py validate --output evidence/check.json
          exit "$build_exit"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-pr-${{ github.event.pull_request.number }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 3
          if-no-files-found: error
          path: |
            evidence/
            native-cache/build/test-results/test/
            native-cache/build/reports/tests/test/
