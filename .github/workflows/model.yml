name: Generic disk overlap mechanism pilot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disk-overlap-pilot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  pilot:
    name: pilot-${{ matrix.mode }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        mode: [serial, overlap]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run bounded same-runner pilot
        timeout-minutes: 8
        shell: bash
        env:
          PILOT_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          exec sudo -n --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,RUNNER_TEMP,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,GITHUB_SHA,ImageOS,ImageVersion \
            python3 -u tools/disk_overlap_pilot.py run \
            --mode "$PILOT_MODE" \
            --output "$RUNNER_TEMP/disk-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$PILOT_MODE"
      - name: Preserve pilot evidence
        if: always()
        timeout-minutes: 1
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: disk-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/disk-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/*.json
            ${{ runner.temp }}/disk-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/*.jsonl
            ${{ runner.temp }}/disk-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/*.log
            ${{ runner.temp }}/disk-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.mode }}/*.stdout
